name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'bogee/BaldPhone'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android API 36
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BALDPHONE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/baldphone-release.jks"
          chmod 600 "$RUNNER_TEMP/baldphone-release.jks"

      - name: Build signed release APK
        env:
          BALDPHONE_RELEASE_KEYSTORE: ${{ runner.temp }}/baldphone-release.jks
          BALDPHONE_RELEASE_STORE_PASSWORD: ${{ secrets.BALDPHONE_RELEASE_STORE_PASSWORD }}
          BALDPHONE_RELEASE_KEY_ALIAS: baldphone
          BALDPHONE_RELEASE_KEY_PASSWORD: ${{ secrets.BALDPHONE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleGPlayRelease

      - name: Verify and package release
        id: package
        env:
          BALDPHONE_RELEASE_KEYSTORE: ${{ runner.temp }}/baldphone-release.jks
          BALDPHONE_RELEASE_STORE_PASSWORD: ${{ secrets.BALDPHONE_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          input_apk="app/build/outputs/apk/gPlay/release/app-gPlay-release.apk"
          test -f "$input_apk"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          package_line="$($aapt dump badging "$input_apk" | head -n 1)"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"

          test "$package_name" = "com.bald.uriah.baldphone.gp"
          test "$GITHUB_REF_NAME" = "v$version_name"
          "$apksigner" verify --verbose --print-certs "$input_apk"

          mkdir -p release
          output_apk="release/BaldPhone-$GITHUB_REF_NAME.apk"
          certificate="release/BaldPhone-signing-certificate.pem"
          checksum="$output_apk.sha256"
          cp "$input_apk" "$output_apk"
          keytool -exportcert -rfc \
            -keystore "$BALDPHONE_RELEASE_KEYSTORE" \
            -storepass:env BALDPHONE_RELEASE_STORE_PASSWORD \
            -alias baldphone \
            -file "$certificate"
          sha256sum "$output_apk" > "$checksum"

          echo "apk=$output_apk" >> "$GITHUB_OUTPUT"
          echo "certificate=$certificate" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK: ${{ steps.package.outputs.apk }}
          RELEASE_CERTIFICATE: ${{ steps.package.outputs.certificate }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_APK" \
            "$RELEASE_CERTIFICATE" \
            "$RELEASE_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BaldPhone ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
