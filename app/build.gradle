apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('BALDPHONE_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('BALDPHONE_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('BALDPHONE_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('BALDPHONE_RELEASE_KEY_PASSWORD')
def releaseSigningValues = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
]
def releaseSigningConfigured = releaseSigningValues.every {
    it != null && !it.trim().isEmpty()
}

if (!releaseSigningConfigured && releaseSigningValues.any { it != null && !it.trim().isEmpty() }) {
    throw new GradleException('All BaldPhone release-signing environment variables must be provided together.')
}


android {
    namespace = 'com.bald.uriah.baldphone'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.bald.uriah.baldphone"
        minSdk = 21
        targetSdk = 36
        versionCode = 104
        versionName = "15.0.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [fullApp: "true", notFullApp: "false", recentCalls: "true", notRecentCalls: "false"]

    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            debuggable = true
            minifyEnabled = false
        }

    }


    flavorDimensions += "updating_mechanism"
    productFlavors {
        baldUpdates {
            dimension = "updating_mechanism"
        }
        fDroid {
            dimension = "updating_mechanism"
        }
        gPlay {
            dimension = "updating_mechanism"
            applicationIdSuffix = ".gp"
            manifestPlaceholders = [fullApp: "true", notFullApp: "false", recentCalls: "false", notRecentCalls: "true"]
        }
        gPlayRecentCalls {
            dimension = "updating_mechanism"
            applicationIdSuffix = ".gprc"
            manifestPlaceholders = [fullApp: "false", notFullApp: "true", recentCalls: "true", notRecentCalls: "false"]
        }
    }
    compileOptions {
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'net.danlew:android.joda:2.10.6'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'
    // Only for tests
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    testImplementation 'junit:junit:4.13.2'
}
